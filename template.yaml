AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 20

    Tracing: Active
    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: NotificationQueue
      VisibilityTimeout: 120 # 6x function timeout (AWS recommendation for Lambda SQS triggers)
      RedrivePolicy: 
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3
  
  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: NotificationDLQ
      VisibilityTimeout: 60
      MessageRetentionPeriod: 1209600 # 14 days
  
  # Secret used to resolve incoming webhook keys to actual webhook URLs
  GoogleWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: GoogleWebhookSecret
      Description: "Google Chat Webhook URL Secret"
  
  # REST API that validates requests and enqueues them to SQS directly (no Lambda)
  # Keeps the implicit API's logical ID and stage name so the existing endpoint URL is preserved
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      DefinitionBody:
        swagger: "2.0"
        info:
          title: !Ref AWS::StackName
        x-amazon-apigateway-request-validators:
          body:
            validateRequestBody: true
            validateRequestParameters: false
        x-amazon-apigateway-gateway-responses:
          BAD_REQUEST_BODY:
            statusCode: 400
            responseTemplates:
              application/json: '{"message": "$context.error.validationErrorString"}'
        definitions:
          NotifyRequest:
            type: object
            required:
              - webhookKey
              - payload
            properties:
              webhookKey:
                type: string
                minLength: 1
              payload:
                type:
                  - object
                  - array
                  - string
        paths:
          /googlechat/notify:
            post:
              consumes:
                - application/json
              produces:
                - application/json
              parameters:
                - in: body
                  name: NotifyRequest
                  required: true
                  schema:
                    $ref: "#/definitions/NotifyRequest"
              x-amazon-apigateway-request-validator: body
              responses:
                "200":
                  description: queued
                "500":
                  description: internal error
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${NotificationQueue.QueueName}"
                credentials: !GetAtt ApiGatewaySqsRole.Arn
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/json: "Action=SendMessage&MessageBody=$util.urlEncode($input.body)"
                responses:
                  default:
                    statusCode: "200"
                    responseTemplates:
                      application/json: |
                        {"message": "queued", "id": "$input.path('$.SendMessageResponse.SendMessageResult.MessageId')"}
                  "4\\d{2}|5\\d{2}":
                    statusCode: "500"
                    responseTemplates:
                      application/json: '{"message": "internal error"}'

  # Role assumed by API Gateway to send messages to the queue
  ApiGatewaySqsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToNotificationQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt NotificationQueue.Arn

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notification_function/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
      - x86_64
      Environment:
        Variables:
          SECRET_ARN: !Ref GoogleWebhookSecret
          GOOGLE_CHAT_TIMEOUT: 5
          GOOGLE_CHAT_RETRIES: 2
          GOOGLE_CHAT_BACKOFF: 0.5
          SECRET_CACHE_TTL: 60
          DYNAMODB_TABLE_NAME: !Ref IdempotencyTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - SQSPollerPolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Ref GoogleWebhookSecret
      Events:
        NotificationEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: 
              - ReportBatchItemFailures

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GooglechatMessagesIdempotency
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
            
  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
